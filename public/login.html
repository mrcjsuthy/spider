<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sign in · Upland Systems Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400&family=Spectral:wght@300;400&display=swap">
<style>
:root{
  color-scheme:light;
  --ground:#E9EBE7; --surface:#FBFCFA; --panel:#F5F6F2;
  --ink:#121716; --ink-2:#4E5754; --ink-3:#7F8985;
  --rule:#D6DAD3; --accent:#1E4A46; --err:#d03b3b;
  --f-ui:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --f-title:"Spectral",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0C100F; --surface:#191E1D; --panel:#141918;
    --ink:#E9ECE8; --ink-2:#A2ABA7; --ink-3:#78827E;
    --rule:#2A312F; --accent:#84B8AD; --err:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0C100F; --surface:#191E1D; --panel:#141918;
  --ink:#E9ECE8; --ink-2:#A2ABA7; --ink-3:#78827E;
  --rule:#2A312F; --accent:#84B8AD; --err:#e66767;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-ui);
  font-size:14px;line-height:1.5;display:grid;place-items:center;padding:1.5rem;
  -webkit-font-smoothing:antialiased;
}
.card{
  width:100%;max-width:23rem;background:var(--surface);border:1px solid var(--rule);
  border-radius:6px;padding:1.75rem;
  box-shadow:0 1px 2px rgba(0,0,0,.06),0 12px 30px rgba(0,0,0,.07);
}
.eyebrow{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 .6rem;
}
h1{font-family:var(--f-title);font-weight:400;font-size:1.6rem;margin:0 0 .35rem;letter-spacing:-.01em}
.sub{color:var(--ink-2);margin:0 0 1.5rem;font-size:13px}
label{
  display:block;font-family:var(--f-mono);font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 .3rem;
}
input{
  width:100%;padding:.55rem .65rem;background:var(--ground);border:1px solid var(--rule);
  border-radius:4px;font:inherit;color:inherit;margin:0 0 1rem;
}
input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{
  width:100%;padding:.6rem;background:var(--accent);color:var(--ground);border:0;
  border-radius:4px;font:inherit;font-weight:600;cursor:pointer;
}
button:hover{opacity:.92}
button[disabled]{opacity:.55;cursor:default}
.err{
  color:var(--err);font-size:12.5px;margin:0 0 1rem;min-height:1.2em;
}
.foot{margin:1.25rem 0 0;font-size:11.5px;color:var(--ink-3);line-height:1.5}
</style>
</head>
<body>
  <form class="card" id="f" autocomplete="on">
    <p class="eyebrow">Upland Retirement</p>
    <h1>Systems Map</h1>
    <p class="sub">The source of truth for every digital system in the village build.</p>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <p class="err" id="err" role="alert"></p>
    <button type="submit" id="go">Sign in</button>

    <p class="foot">Accounts are created by an administrator. If you need access, ask the Head of Digital.</p>
  </form>

<script>
var f=document.getElementById("f"),err=document.getElementById("err"),go=document.getElementById("go");
f.addEventListener("submit",function(ev){
  ev.preventDefault();
  err.textContent="";go.disabled=true;go.textContent="Signing in…";
  fetch("/api/auth/login",{
    method:"POST",credentials:"same-origin",
    headers:{"content-type":"application/json"},
    body:JSON.stringify({email:document.getElementById("email").value,
                         password:document.getElementById("password").value})
  }).then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})})
    .then(function(res){
      if(!res.ok)throw new Error(res.j.error||"Sign in failed");
      location.href="/";
    })["catch"](function(e){
      err.textContent=e.message;
      go.disabled=false;go.textContent="Sign in";
      document.getElementById("password").select();
    });
});
</script>
</body>
</html>
